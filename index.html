const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const disc=p=>p.old&&p.price&&p.old>p.price?Math.round((1-p.price/p.old)*100):0;

function render(){admin?renderAdmin():renderSite()}

const paths={bag:'<path d="M5 7h14l1 14H4L5 7Z"/><path d="M8 8V6a4 4 0 0 1 8 0v2"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',external:'<path d="M14 4h6v6m0-6L10 14"/><path d="M10 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/>',chat:'<path d="M21 11.5a9 9 0 0 1-13.5 7.8L3 21l1.7-4.5A9 9 0 1 1 21 11.5Z"/><path d="M8 8c0 4 4 8 8 8m-8-8 2 2m4 4 2 2"/>',check:'<path d="m5 12 4 4L19 6"/>',spark:'<path d="m12 3 2.6 6.4L21 12l-6.4 2.6L12 21l-2.6-6.4L3 12l6.4-2.6L12 3Z"/>',home:'<path d="m3 10 9-7 9 7M5 9v12h14V9M9 21v-8h6v8"/>',kitchen:'<path d="M4 3v6a3 3 0 0 0 6 0V3M7 3v18m13 0V3c-5 2-5 10 0 10"/>',tech:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/>',beauty:'<path d="M8 12h8v9H8zM9 12V5l6-3v10m-7 5h8"/>',fashion:'<path d="m8 3-6 5 4 4 2-2v11h8V10l2 2 4-4-6-5c0 4-8 4-8 0Z"/>',tools:'<path d="M14 6a5 5 0 0 0-6 6l-5 5a3 3 0 0 0 4 4l5-5a5 5 0 0 0 6-6l-3 3-4-4 3-3Z"/>',pet:'<ellipse cx="12" cy="16" rx="5" ry="4"/><ellipse cx="5" cy="10" rx="2" ry="3"/><ellipse cx="10" cy="5" rx="2" ry="3"/><ellipse cx="16" cy="5" rx="2" ry="3"/><ellipse cx="21" cy="10" rx="2" ry="3"/>'};
const icon=n=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.bag}</svg>`;
const categoryIcon=c=>({'Casa e Móveis':'home','Cozinha':'kitchen','Eletrônicos':'tech','Beleza':'beauty','Moda':'fashion','Ferramentas':'tools','Pet':'pet','Todos':'spark'}[c]||'bag');
const brand=()=>`<span class="brand-mark">${icon('bag')}</span><span class="logo">Achadinho <b>do Cafofo</b></span>`;
const normalize=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function productCard(p){return `<article class="card"><div class="img">${p.img?`<img loading="lazy" decoding="async" src="${esc(p.img)}" alt="${esc(p.name)}">`:`<div class="placeholder">${icon(categoryIcon(p.cat))}<span>Foto em breve</span></div>`}<span class="badge">${esc(p.store)}</span>${disc(p)?`<span class="off">−${disc(p)}%</span>`:''}</div><div class="cb"><small>${esc(p.cat)}</small><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="price">${p.old>p.price&&p.price?`<s>${brl(p.old)}</s>`:''}${p.price?brl(p.price):'<span class="consult">Consulte na loja</span>'}</div><a class="btn offer-link" data-product="${esc(p.id)}" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer sponsored" aria-label="${esc('Ver oferta de '+p.name+' na '+p.store)}">Ver oferta ${icon('external')}</a><span class="shop-note">Você compra na ${esc(p.store)}</span></div></article>`}
function clubCard(){return `<aside class="club-card" id="grupo"><div class="club-mark">${icon('chat')}</div><div class="section-kicker">O próximo achado pode ser seu</div><h3>Boas ofertas,<br>direto no grupo.</h3><p>Receba os achadinhos no WhatsApp e encontre algo que combina com você.</p><a class="btn" href="${esc(S.wa)}" target="_blank" rel="noopener noreferrer" onclick="cw()">Quero fazer parte ${icon('arrow')}</a><small>É grátis. É só entrar e acompanhar.</small></aside>`}
function filteredProducts(){const list=S.products.filter(p=>p.active&&(cat==='Todos'||p.cat===cat)&&normalize(p.name+' '+p.desc+' '+p.store+' '+p.cat).includes(normalize(q)));return list.sort((a,b)=>order==='low'?(a.price||Infinity)-(b.price||Infinity):order==='high'?(b.price||0)-(a.price||0):order==='discount'?disc(b)-disc(a):b.at-a.at)}
function updateResults(){const list=filteredProducts();$('#result-count').textContent=`${list.length} ${list.length===1?'achadinho encontrado':'achadinhos encontrados'}${cat!=='Todos'?' · '+cat:''}`;$('#clear-filters').hidden=!q&&cat==='Todos';const grid=$('#products');const showClub=list.length>0;grid.classList.toggle('has-club',showClub);grid.innerHTML=list.length?list.map(productCard).join('')+clubCard():`<div class="empty">${icon('search')}<h3>Vamos tentar outro achado?</h3><p>Nenhum produto encontrado. Busque outro nome ou escolha outra categoria.</p><button class="btn ghost sm" onclick="resetFilters()">Ver todos os produtos</button></div>`;grid.querySelectorAll('.offer-link').forEach(a=>a.onclick=()=>ck(a.dataset.product))}
function resetFilters(){q='';cat='Todos';renderSite()}
function renderSite(){
 const act=S.products.filter(p=>p.active);
 const cats=['Todos',...S.cats.filter(c=>act.some(p=>p.cat===c))];
 $('#app').innerHTML=`
 <a href="#cat" class="skip">Ir para os produtos</a>
 <div class="announcement">Um toque de novidade para o seu dia. <span>Bem-vindo ao seu cafofo de achados.</span></div>
 <header class="top"><div class="wrap"><a class="brand" href="#" aria-label="Achadinho do Cafofo — início">${brand()}</a><div class="sp"></div><a class="nav-link" href="#cat">Explorar achadinhos</a><a class="btn wa sm" href="${esc(S.wa)}" target="_blank" rel="noopener noreferrer" onclick="cw()">${icon('chat')} Entrar no grupo</a></div></header>
 <section class="hero" aria-labelledby="hero-title"><div class="wrap hero-in"><div class="hero-tx"><div class="eyebrow"><i></i> Uma boa descoberta começa aqui</div><h1 id="hero-title">Seu dia merece<br>um <em>bom achadinho.</em></h1><p>Para a casa, para você e para facilitar a rotina. Uma seleção de produtos para encontrar o que vale a pena.</p><div class="cta"><a class="btn" href="#cat">Explorar ofertas ${icon('arrow')}</a><a class="text-link" href="${esc(S.wa)}" target="_blank" rel="noopener noreferrer" onclick="cw()">Nosso grupo ${icon('chat')}</a></div></div><div class="hero-side"><div class="side-top"><span>Garimpos do Cafofo</span><div class="side-icon">${icon('bag')}</div></div><h2>Pequenos achados.<br><em>Boas escolhas.</em></h2><div class="side-bottom">${icon('check')} Você descobre aqui. Compra na loja.</div></div></div></section>
 <div class="stores"><div class="wrap"><span class="stores-label">Achadinhos em lojas que você conhece</span><div class="store-names" aria-label="Shopee, Mercado Livre, Amazon e AliExpress"><span>Shopee</span><span>mercado livre</span><span>amazon</span><span>AliExpress</span></div></div></div>
 <main class="wrap catalog" id="cat"><div class="catalog-head"><div><div class="section-kicker">Escolhidos para o seu dia a dia</div><h2>Explore os achadinhos</h2></div><p>Seu próximo favorito pode estar aqui.</p></div>
 <div class="tools"><div class="search-row"><label class="search-field" for="q">${icon('search')}<input id="q" type="search" autocomplete="off" aria-label="Buscar produto, categoria ou loja" placeholder="Buscar produto ou loja" value="${esc(q)}"></label><div class="sort-field"><label for="sort">Ordenar por</label><select id="sort" aria-label="Ordenar produtos"><option value="recent" ${order==='recent'?'selected':''}>Mais recentes</option><option value="low" ${order==='low'?'selected':''}>Menor preço</option><option value="high" ${order==='high'?'selected':''}>Maior preço</option><option value="discount" ${order==='discount'?'selected':''}>Maior desconto</option></select></div></div><nav class="chips" aria-label="Categorias de produtos">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${esc(c)}" aria-pressed="${c===cat}">${icon(categoryIcon(c))}${esc(c==='Todos'?'Todos os achados':c)}</button>`).join('')}</nav></div>
 <div class="results-bar"><span id="result-count" role="status" aria-live="polite"></span><button id="clear-filters" class="clear-filters" onclick="resetFilters()" hidden>Limpar filtros</button></div><div class="grid" id="products"></div>
 <section class="how" aria-label="Como funciona"><div class="how-item"><div class="how-icon">${icon('search')}</div><div><h3>Encontre seu achadinho</h3><p>Navegue pelas categorias ou busque o que precisa.</p></div></div><div class="how-item"><div class="how-icon">${icon('external')}</div><div><h3>Confira a oferta na loja</h3><p>Preços e disponibilidade podem mudar. Confira antes de comprar.</p></div></div><div class="how-item"><div class="how-icon">${icon('bag')}</div><div><h3>Compre do seu jeito</h3><p>Pagamento, entrega e atendimento são feitos pela loja.</p></div></div></section></main>
 <footer><div class="wrap"><div class="footer-row"><a class="brand" href="#" aria-label="Voltar ao início">${brand()}</a><p class="disclosure">Achadinhos para deixar a rotina mais prática. Como afiliados, podemos receber comissão pelas compras feitas pelos nossos links, sem custo extra para você.</p></div><div class="footer-bottom"><span>Achadinho do Cafofo · Feito para descobrir coisas boas.</span><button class="admin-link" onclick="openAdmin()">Painel administrativo</button></div></div></footer>`;
 $('#q').oninput=e=>{q=e.target.value;updateResults()};$('#sort').onchange=e=>{order=e.target.value;updateResults()};
 document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{cat=b.dataset.c;document.querySelectorAll('.chip').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',String(x===b))});updateResults()});
 updateResults();
}

function ck(id){ST.clicks++;ST.prod[id]=(ST.prod[id]||0)+1;save()}
function cw(){ST.wa++;save()}
function openAdmin(){admin=true;authed=false;render();scrollTo(0,0)}
function closeAdmin(){admin=false;render()}

function storeOf(u){const h=u.toLowerCase();return /shopee|shp\.ee/.test(h)?"Shopee":/mercadoli|mercadolibre|meli\.la/.test(h)?"Mercado Livre":/amazon|amzn/.test(h)?"Amazon":/aliexpress|s\.click\.ali/.test(h)?"AliExpress":/magazine|magalu/.test(h)?"Magalu":"Outra loja"}
function guess(u){let n="";try{const seg=new URL(u).pathname.split("/").filter(x=>x.includes("-")).sort((a,b)=>b.length-a.length)[0]||"";n=decodeURIComponent(seg).replace(/-i\.\d+.*$/,"").replace(/[-_]+/g," ").replace(/\b(MLB|p)\s?\d+.*$/i,"").trim();n=n.charAt(0).toUpperCase()+n.slice(1)}catch(e){}
 const t=n.toLowerCase(),map=[["Cozinha",/panela|fritadeira|copo|garrafa|faca|air ?fryer|cozinha|talher/],["Eletrônicos",/fone|carregador|cabo|smart|celular|led|camera|bluetooth|mouse|teclado/],["Beleza",/creme|batom|perfume|maquiagem|cabelo|shampoo|skin/],["Moda",/camisa|tenis|bolsa|vestido|relogio|bermuda|calça/],["Ferramentas",/furadeira|chave|parafus|ferramenta|alicate/],["Pet",/pet|cachorro|gato|coleira/],["Casa e Móveis",/puff|sofa|estante|mesa|cadeira|poltrona|organizador|luminaria|tapete|cama/]];
 const c=(map.find(m=>m[1].test(t))||[])[0]||"Outros";return{name:n,cat:c}}

function stats(){const a=S.products,act=a.filter(p=>p.active);
 const by=(k)=>{const o={};a.forEach(p=>o[p[k]]=(o[p[k]]||0)+1);return Object.entries(o).sort((x,y)=>y[1]-x[1])};
 return{total:a.length,act:act.length,ina:a.length-act.length,by:by,cats:by("cat"),stores:by("store")}}
const bars=(arr)=>{const m=Math.max(1,...arr.map(x=>x[1]));return arr.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/m*100}%"></i><b>${v}</b></div>`).join("")||"<p class='note'>Sem dados ainda.</p>"};
function days7(){const out=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);out.push([d.slice(8)+"/"+d.slice(5,7),ST.days[d]||0])}return out}

function renderAdmin(){
 if(!authed){$("#app").innerHTML=`<div class="ov"><div class="login panel"><h2>Área restrita</h2><p style="color:var(--mut)">Entre com seu login e senha</p><input id="usr" placeholder="Login" autocomplete="username" autofocus><br><br><input id="pin" type="password" placeholder="Senha" autocomplete="current-password"><br><br><button class="btn" id="go">Entrar</button> <button class="btn ghost" onclick="closeAdmin()">Voltar</button></div></div>`;
  const go=()=>{if($("#usr").value.trim().toLowerCase()===S.user.toLowerCase()&&$("#pin").value===S.pin){authed=true;render()}else toast("Login ou senha incorretos")};$("#go").onclick=go;$("#pin").onkeydown=e=>e.key==="Enter"&&go();return}
 const s=stats(),top=[...S.products].sort((a,b)=>(ST.prod[b.id]||0)-(ST.prod[a.id]||0)).slice(0,5).filter(p=>ST.prod[p.id]);
 const e=editing?S.products.find(p=>p.id===editing):null;
 $("#app").innerHTML=`<div class="ov"><div class="ah"><div class="wrap"><div class="logo">Painel · Achadinho <b>do Cafofo</b></div><div class="sp"></div><button class="btn sm" onclick="pub()">Baixar site atualizado</button><button class="btn ghost sm" style="color:#fdf6e3" onclick="closeAdmin()">Ver site</button></div></div>
 <div class="wrap"><div class="kpis">
 <div class="kpi"><b>${s.total}</b><span>Produtos</span></div><div class="kpi"><b style="color:var(--g2)">${s.act}</b><span>Ativos</span></div><div class="kpi"><b style="color:var(--red)">${s.ina}</b><span>⏸ Inativos</span></div>
 <div class="kpi"><b>${ST.visits}</b><span>Visitas</span></div><div class="kpi"><b>${ST.clicks}</b><span>Cliques em ofertas</span></div><div class="kpi"><b>${ST.wa}</b><span>Cliques no WhatsApp</span></div>
 <div class="kpi"><b>${ST.visits?Math.round(ST.clicks/ST.visits*100):0}%</b><span>Cliques por visita</span></div></div>
 <div class="panel"><h3>${e?"Editar produto":"Novo produto"}</h3>
 <label style="font-size:12px;font-weight:800;color:var(--mut)">Cole o link do produto</label>
 <div style="display:flex;gap:8px;margin-bottom:10px"><input id="fu" placeholder="https://shopee.com.br/..." value="${esc(e?.url||"")}"><button class="btn" onclick="auto()">Preencher</button></div>
 <div class="f"><div><label>Nome</label><input id="fn" value="${esc(e?.name||"")}"></div>
 <div><label>Loja</label><input id="fs" value="${esc(e?.store||"")}"></div>
 <div><label>Categoria</label><select id="fc">${S.cats.map(c=>`<option ${e?.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
 <div><label>Preço (R$)</label><input id="fp" type="number" step="0.01" value="${e?.price||""}"></div>
 <div><label>Preço antes (R$)</label><input id="fo" type="number" step="0.01" value="${e?.old||""}"></div>
 <div><label>Link da foto (opcional)</label><input id="fi" value="${esc(e?.img&&!e.img.startsWith("data:")?e.img:"")}"></div>
 <div><label>ou enviar foto</label><input id="ff" type="file" accept="image/*"></div></div>
 <div style="margin:10px 0"><label style="font-size:12px;font-weight:800;color:var(--mut)">Descrição</label><textarea id="fd" rows="2">${esc(e?.desc||"")}</textarea></div>
 <button class="btn" onclick="add()">${e?"Salvar alterações":"Adicionar ao catálogo"}</button> ${e?`<button class="btn ghost" onclick="editing=null;render()">Cancelar</button>`:""}
 <p class="note">O botão  detecta a loja, sugere nome e categoria a partir do link. Lojas bloqueiam a leitura automática de foto e preço por navegador: cole o link da imagem (botão direito na foto → copiar endereço) ou envie o arquivo. Depois de editar, clique em <b>Baixar site atualizado</b> e substitua o HTML na sua hospedagem para atualizar o catálogo para todos.</p></div>
 <div class="two"><div class="panel"><h3>Produtos por categoria</h3>${bars(s.cats)}</div><div class="panel"><h3>Produtos por loja</h3>${bars(s.stores)}</div>
 <div class="panel"><h3>Visitas (7 dias)</h3>${bars(days7())}</div><div class="panel"><h3>Mais clicados</h3>${bars(top.map(p=>[p.name.slice(0,16),ST.prod[p.id]]))}</div></div>
 <div class="panel"><h3>Todos os produtos</h3><div class="tw"><table><tr><th></th><th>Produto</th><th>Loja</th><th>Cliques</th><th>Status</th><th>Ações</th></tr>
 ${[...S.products].sort((a,b)=>b.at-a.at).map(p=>`<tr><td>${p.img?`<img src="${esc(p.img)}" alt="">`:""}</td><td><b>${esc(p.name)}</b><br><small>${esc(p.cat)} · ${brl(p.price)}</small></td><td>${esc(p.store)}</td><td>${ST.prod[p.id]||0}</td>
 <td><span class="tag ${p.active?"on-t":"off-t"}">${p.active?"Ativo":"Inativo"}</span></td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="tg('${p.id}')">${p.active?"Desativar":"Ativar"}</button> <button class="btn ghost sm" onclick="editing='${p.id}';render();scrollTo(0,0)">Editar</button> <button class="btn red sm" onclick="del('${p.id}')">Excluir</button></td></tr>`).join("")||`<tr><td colspan=6>Nenhum produto.</td></tr>`}</table></div></div>
 <div class="panel"><h3>Configurações</h3><div class="f"><div><label>Link do grupo do WhatsApp</label><input id="sw" value="${esc(S.wa)}"></div><div><label>Login do painel</label><input id="su" value="${esc(S.user)}"></div><div><label>Senha do painel</label><input id="sp" value="${esc(S.pin)}"></div></div><br>
 <button class="btn" onclick="cfg()">Salvar</button> <button class="btn ghost" onclick="bk()">⬇ Backup (JSON)</button>
 <p class="note">Visitas e cliques são contados neste navegador. Para contar o público inteiro (todos os visitantes), é preciso ligar o site a um banco de dados, como Supabase + Vercel. Dá para fazer como próximo passo. O login e a senha ficam no código da página, então servem como trava simples, não como segurança forte.</p></div>
 </div></div>`}

function auto(){const u=$("#fu").value.trim();if(!u)return toast("Cole um link primeiro");const g=guess(u);$("#fs").value=storeOf(u);if(!$("#fn").value)$("#fn").value=g.name;$("#fc").value=g.cat;toast("Preenchido! Confira os dados")}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,520/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.72))};i.src=URL.createObjectURL(f)});
async function add(){const url=$("#fu").value.trim(),name=$("#fn").value.trim();if(!url||!name)return toast("Informe link e nome");
 let img=$("#fi").value.trim();const f=$("#ff").files[0];if(f)img=await shrink(f);
 const o=editing&&S.products.find(p=>p.id===editing);
 const d={url,name,store:$("#fs").value.trim()||storeOf(url),cat:$("#fc").value,price:parseFloat($("#fp").value)||0,old:parseFloat($("#fo").value)||0,img:img||(o&&o.img)||"",desc:$("#fd").value.trim()||"Confira essa oferta!"};
 if(o){Object.assign(o,d)}else S.products.push({id:"p"+Date.now(),emoji:EM[d.cat],active:true,at:Date.now(),...d});
 editing=null;save();render();scrollTo(0,0);toast("Salvo! Clique em Baixar site atualizado");}
function tg(id){const p=S.products.find(x=>x.id===id);p.active=!p.active;save();render()}
function del(id){if(confirm("Excluir este produto?")){S.products=S.products.filter(p=>p.id!==id);save();render()}}
function cfg(){S.wa=$("#sw").value.trim()||S.wa;S.pin=$("#sp").value.trim()||S.pin;S.user=$("#su").value.trim()||S.user;save();toast("Configurações salvas")}

function downloadFile(filename,data,type){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function bk(){downloadFile('backup-achadinho.json',JSON.stringify({S,ST},null,2),'application/json');toast('Backup baixado')}
function pub(){try{const c=document.documentElement.cloneNode(true);c.querySelector('#seed').textContent=JSON.stringify(S).replace(/</g,'\\u003c');c.querySelector('#app').innerHTML='';c.querySelector('#modal').innerHTML='';c.querySelectorAll('.toast').forEach(t=>t.remove());downloadFile('index.html','<!doctype html>\n'+c.outerHTML,'text/html;charset=utf-8');toast('HTML baixado! Envie o arquivo para sua hospedagem.')}catch(e){toast('Não foi possível baixar o HTML. Tente novamente.')}}

render();
</script>
</body>
</html>
