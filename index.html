 const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
 const types=o=>[].concat(o?.['@type']||[]);
 function money(v){if(typeof v==='number')return Number.isFinite(v)&&v>0?v:null;let s=clean(v).replace(/[^\d.,]/g,'');if(!s)return null;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');const n=Number(s);return Number.isFinite(n)&&n>0&&n<1e9?n:null}
 function image(v,base){v=Array.isArray(v)?v[0]:v;if(v&&typeof v==='object')v=v.url||v.contentUrl;if(!v||typeof v!=='string')return '';try{const u=new URL(v,base);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}}
 function category(s){s=clean(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return ([['Cozinha',/panela|fritadeira|talher|air.?fryer|cozinha|copo|prato|garrafa/],['Pet',/\bpet\b|cachorro|coleira|racao|gato/],['Eletrônicos',/fone|carregador|smart|celular|camera|bluetooth|mouse|teclado|eletron/],['Beleza',/creme|batom|perfume|maquiagem|cabelo|shampoo|skin/],['Ferramentas',/furadeira|parafus|ferramenta|alicate|serra/],['Casa e Móveis',/varal|lavanderia|puff|sofa|estante|mesa|cadeira|poltrona|organizador|luminaria|tapete|cama|casa|movel|moveis/],['Moda',/camisa|tenis|bolsa|vestido|relogio|bermuda|calca/]].find(x=>x[1].test(s))||[])[0]||'Outros'}
 function store(url){let h='';try{h=new URL(url).hostname}catch{}return /mercadoli|meli\.la/.test(h)?'Mercado Livre':/shopee|shp\.ee/.test(h)?'Shopee':/amazon|amzn/.test(h)?'Amazon':/aliexpress/.test(h)?'AliExpress':/magalu|magazinevoce|magazineluiza/.test(h)?'Magalu':''}
 function extract(doc,url){
  const text=s=>clean(doc.querySelector(s)?.textContent);
  const meta=(...keys)=>{for(const k of keys){const n=doc.querySelector(`meta[property="${k}"],meta[name="${k}"],meta[itemprop="${k}"]`);if(n?.getAttribute('content'))return clean(n.getAttribute('content'))}return ''};
  const products=[];let visited=0;
  function walk(n,depth=0){if(!n||typeof n!=='object'||depth>18||++visited>16000)return;if(Array.isArray(n)){n.forEach(v=>walk(v,depth+1));return}if(types(n).includes('Product'))products.push(n);for(const k of ['@graph','mainEntity','itemListElement','item','hasVariant'])if(n[k])walk(n[k],depth+1)}
  doc.querySelectorAll('script[type="application/ld+json"]').forEach(s=>{try{walk(JSON.parse(s.textContent))}catch{}});
  const p=products.find(x=>x.name&&x.offers)||products.find(x=>x.name)||{};
  const offer=[].concat(p.offers||[]).find(o=>o.price!=null||o.priceSpecification?.price!=null)||[].concat(p.offers||[])[0]||{};
  const displayedMoney=sel=>{const e=doc.querySelector(sel);if(!e)return null;const fraction=e.querySelector('.andes-money-amount__fraction');if(fraction){const f=clean(fraction.textContent).replace(/\D/g,'');const cents=clean(e.querySelector('.andes-money-amount__cents')?.textContent)||'00';return money(f+'.'+cents.padEnd(2,'0').slice(0,2))}return money(e.getAttribute('content')||e.textContent)};
  const name=clean(p.name||text('.ui-pdp-title')||text('#productTitle')||text('[itemprop="name"]')||meta('og:title','twitter:title')||doc.title).replace(/\s*[|–-]\s*(Mercado Livre|Amazon\.com\.br|Shopee Brasil).*$/i,'');
  const price=displayedMoney('.ui-pdp-price__second-line .andes-money-amount:not(.andes-money-amount--previous)')||money(offer.price??offer.priceSpecification?.price)||money(meta('product:price:amount','og:price:amount','price'))||displayedMoney('[itemprop="price"]')||displayedMoney('.a-price:not(.a-text-price) .a-offscreen');
  const old=displayedMoney('.andes-money-amount--previous')||displayedMoney('.a-text-price .a-offscreen');
  const currency=clean(offer.priceCurrency||meta('product:price:currency','og:price:currency','priceCurrency'));
  const rawDesc=p.description||text('.ui-pdp-description__content')||meta('og:description','description','twitter:description');
  const fragments=[...doc.querySelectorAll('.ui-pdp-highlights__item,#feature-bullets li')].map(x=>clean(x.textContent)).filter(Boolean);
  const catText=clean(p.category||text('.andes-breadcrumb')||text('[aria-label="breadcrumb"]'));
  const rating=p.aggregateRating||{};
  const fields=[['Marca',typeof p.brand==='object'?p.brand?.name:p.brand],['Cor',p.color],['Modelo',p.model],['Material',p.material],['Avaliação',rating.ratingValue?`${rating.ratingValue}/5${rating.reviewCount?' ('+rating.reviewCount+' avaliações)':''}`:'']].filter(x=>x[1]);
  const description=clean(rawDesc).replace(/<[^>]*>/g,'').slice(0,5000);
  const desc=[description,...fragments,...fields.map(x=>x.join(': '))].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join('\n').slice(0,6000);
  const img=image(p.image||meta('og:image','twitter:image')||doc.querySelector('.ui-pdp-image.ui-pdp-gallery__figure__image')?.getAttribute('src')||doc.querySelector('#landingImage')?.getAttribute('src'),url);
  const productDetected=Boolean(products.length||doc.querySelector('.ui-pdp-title,#productTitle,[itemtype*="schema.org/Product"]')||/product/i.test(meta('og:type'))||price);
  return {name:name.slice(0,400),price:currency&&currency!=='BRL'?null:price,old:old&&price&&old>price?old:null,img,desc,cat:category(catText+' '+name),store:store(url),sourceUrl:url,currency:currency||'BRL',brand:clean(typeof p.brand==='object'?p.brand?.name:p.brand),color:clean(p.color),rating:clean(rating.ratingValue),reviewCount:clean(rating.reviewCount),productDetected,capturedAt:new Date().toISOString()};
 }
 return {extract,money,category,store,image,clean};
}

const ImportTools=productTools();
let importRequest=null;
function importStatus(message,kind='ok'){const n=$('#import-status');if(!n)return;n.hidden=false;n.dataset.kind=kind;n.textContent=message}
function openImportProduct(a){try{const u=new URL($('#fu').value.trim());if(u.protocol!=='https:')throw Error();a.href=u.href;return true}catch{importStatus('Cole primeiro um link HTTPS válido do produto.','error');return false}}
function captureBookmark(){const program=`(()=>{const t=(${productTools.toString()})();const p=t.extract(document,location.href);if(!p.name||p.productDetected===false||(!p.img&&!p.price&&!p.desc)){alert('Abra a página de um produto e tente novamente.');return}const data='CAFOFO_PRODUCT_V1:'+JSON.stringify(p);const fallback=()=>prompt('Copie os dados abaixo e cole no painel do Cafofo:',data);if(navigator.clipboard&&document.hasFocus()){navigator.clipboard.writeText(data).then(()=>alert('Produto capturado! Volte ao painel e cole os dados em “Ler dados colados”.')).catch(fallback)}else fallback()})();`;return 'javascript:'+encodeURIComponent(program)}
function applyImportedProduct(p,source,initial){
 if(!p||typeof p!=='object'||typeof p.name!=='string'||!p.name.trim()||p.productDetected===false)throw Error('Os dados não contêm o nome do produto.');
 const mapping={name:'#fn',store:'#fs',cat:'#fc',price:'#fp',old:'#fo',img:'#fi',desc:'#fd'};const found=[];
 const labels={name:'nome',store:'loja',cat:'categoria',price:'preço',old:'preço anterior',img:'foto',desc:'descrição'};
 for(const [key,sel]of Object.entries(mapping)){
  const n=$(sel);let value=p[key];if(value==null||value==='')continue;
  if(key==='price'||key==='old'){value=ImportTools.money(value);if(!value||p.currency&&p.currency!=='BRL')continue}
  else if(typeof value!=='string')continue;
  if(key==='img'){value=ImportTools.image(value,p.sourceUrl);if(!value)continue}
  if(key==='cat'&&![...n.options].some(o=>o.value===value))continue;
  // Preserve changes typed by the user while the network request was running.
  if(initial&&n.value!==initial[sel])continue;
  n.value=String(value).slice(0,key==='desc'?6000:2000);found.push(labels[key]);
 }
 if(!found.includes('preço anterior')&&(!initial||$('#fo').value===initial['#fo']))$('#fo').value='';
 const box=$('#import-preview');box.hidden=false;$('#import-name').textContent=p.name.slice(0,400);$('#import-fields').textContent='Importado: '+found.join(', ')+'.';$('#import-source').textContent=source;
 const photo=$('#import-photo');const img=ImportTools.image(p.img,p.sourceUrl);photo.hidden=!img;if(img){photo.referrerPolicy="no-referrer";photo.onload=()=>{photo.hidden=false};photo.onerror=()=>{photo.hidden=true};photo.src=img}else photo.removeAttribute('src');
 const missing=[!p.price?'preço':'',!p.img?'foto':'',!p.desc?'descrição':''].filter(Boolean);
 importStatus('Dados importados. '+(missing.length?'Não disponível: '+missing.join(', ')+'. ':'')+'Confira as informações e salve o produto. Seu link de afiliado foi mantido.',missing.length?'error':'ok');
}
const PUBLIC_STORES=['meli.la','mercadolivre.com.br','mercadolibre.com','shopee.com.br','shopee.com','shp.ee','amazon.com.br','amazon.com','amzn.to','amzn.eu','aliexpress.com','aliexpress.us','magazineluiza.com.br','magalu.com','magazinevoce.com.br'];
function publicProductUrl(value){const u=new URL(value);if(u.protocol!=='https:'||u.username||u.password||u.port&&!['443'].includes(u.port)||!PUBLIC_STORES.some(d=>u.hostname===d||u.hostname.endsWith('.'+d)))throw Error('Use um link HTTPS de Mercado Livre, Shopee, Amazon, AliExpress ou Magalu.');return u.href}
const sameTitle=(a,b)=>normalize(a).replace(/[^a-z0-9]+/g,' ').trim()===normalize(b).replace(/[^a-z0-9]+/g,' ').trim();
function cardProduct(doc,url){
 // A short affiliate link can lead to a social profile containing many products.
 // Only read the explicitly featured/single product, never the recommendations.
 let card=doc.querySelector('.ui-recommendations-list__items-wrapper--single .poly-card,.poly-card--featured');
 if(!card){const wanted=doc.querySelector('meta[property="og:title"]')?.content;const title=wanted&&[...doc.querySelectorAll('.poly-component__title')].find(n=>sameTitle(n.textContent,wanted));card=title?.closest('.poly-card')}
 if(!card)return null;
 const title=card.querySelector('.poly-component__title');const name=ImportTools.clean(title?.textContent);if(!name)return null;
 const amount=selector=>{const n=card.querySelector(selector);if(!n)return null;const fraction=n.querySelector('.andes-money-amount__fraction'),cents=n.querySelector('.andes-money-amount__cents');return fraction?ImportTools.money(fraction.textContent.replace(/\D/g,'')+'.'+(cents?.textContent.trim()||'00').padEnd(2,'0')):ImportTools.money(n.textContent)};
 const price=amount('.poly-price__current .andes-money-amount');const previous=amount('.andes-money-amount--previous');
 const image=card.querySelector('img.poly-component__picture');const img=ImportTools.image(image?.getAttribute('src')||image?.getAttribute('data-src'),url);
 const seller=ImportTools.clean(card.querySelector('.poly-component__seller')?.textContent);let detailsUrl='';try{const raw=new URL(title.getAttribute('href'),url);const params=new URLSearchParams(raw.hash.slice(1));const wid=raw.searchParams.get('wid')||params.get('wid');const filter=raw.searchParams.get('pdp_filters');raw.hash='';raw.search='';if(wid&&/^MLB\d+$/.test(wid))raw.searchParams.set('wid',wid);if(filter)raw.searchParams.set('pdp_filters',filter);detailsUrl=publicProductUrl(raw.href)}catch{}
 return {name,price,old:previous&&price&&previous>price?previous:null,img,desc:[name,seller?'Loja: '+seller.replace(/^Por\s+/i,''):''].filter(Boolean).join('\n'),cat:ImportTools.category(name),store:ImportTools.store(url)||'Mercado Livre',currency:'BRL',sourceUrl:url,detailsUrl,productDetected:true,descriptionKind:'title',capturedAt:new Date().toISOString()};
}
function markdownProduct(raw,url){
 const lines=raw.split('\n'),title=lines.find(s=>s.startsWith('Title: '))?.slice(7).trim();if(!title)return null;
 const images=[...raw.matchAll(/!\[(?:Image\s+\d+:?\s*)?([^\]]*)\]\((https?:[^\s)]+)\)/g)];const image=images.find(m=>sameTitle(m[1],title));if(!image)return null;
 const start=raw.indexOf(image[0]);const rest=raw.slice(start+image[0].length);const next=rest.search(/!\[/);const part=rest.slice(0,next<0?3000:next);
 const prices=part.split('\n').filter(s=>!/(?:\d+\s*x\s*|cupom|meli\+|assinatura|primeira compra)/i.test(s));const oldLine=prices.find(s=>/~~.*R\$/.test(s));const current=prices.find(s=>/R\$/.test(s)&&!s.includes('~~'));
 const amount=s=>ImportTools.money((s||'').match(/R\$\s*(\d[\d.]*,\d{2}|\d+[.]\d{2}|\d+)/)?.[1]);const price=amount(current),old=amount(oldLine);
 if(!price)return null;
 return {name:title,img:ImportTools.image(image[2],url),price,old:old>price?old:null,desc:title,cat:ImportTools.category(title),store:ImportTools.store(url),currency:'BRL',sourceUrl:url,productDetected:true,descriptionKind:'title'};
}
function readProductPage(raw,url){
 if(!/^\s*(?:<!doctype|<html|<head|<meta)/i.test(raw))return markdownProduct(raw,url);
 const doc=new DOMParser().parseFromString(raw,'text/html');const result=ImportTools.extract(doc,url);
 if(result.productDetected&&result.name&&!/captcha|access denied|acesso negado|verifique.*humano|iniciar sess[aã]o|mercado libre$/i.test(result.name))return result;
 return cardProduct(doc,url);
}
async function limitedPublicFetch(url,{signal,headers}={}){
 const r=await fetch(url,{method:'GET',headers,signal,credentials:'omit',referrerPolicy:'no-referrer'});
 if(!r.ok)throw Error(r.status===429?'O serviço de leitura atingiu o limite temporário. Tente novamente mais tarde ou use a captura abaixo.':'O serviço não conseguiu ler esta página.');
 if(!r.body){const text=await r.text();if(text.length>3000000)throw Error('A resposta da loja é muito grande.');return text}
 const reader=r.body.getReader(),chunks=[];let size=0;try{while(true){const {done,value}=await reader.read();if(done)break;size+=value.length;if(size>3000000)throw Error('A resposta da loja é muito grande.');chunks.push(value)}}catch(e){await reader.cancel();throw e}
 const decoder=new TextDecoder();return chunks.map(c=>decoder.decode(c,{stream:true})).join('')+decoder.decode();
}
async function readThroughService(url,signal){const text=await limitedPublicFetch('https://r.jina.ai/'+url,{signal,headers:{'X-Respond-With':'html'}});return readProductPage(text,url)}
async function metadataThroughService(url,signal){
 const raw=await limitedPublicFetch('https://api.microlink.io?'+new URLSearchParams({url}),{signal});const data=JSON.parse(raw);if(data.status!=='success'||!data.data)throw Error('Metadados indisponíveis.');const p=data.data;
 const name=ImportTools.clean(p.title);const img=ImportTools.image(p.image?.url,url);if(!name||!img||/perfil social|^mercado liv?re$|access denied|captcha|acesso negado/i.test(name))throw Error('A loja não retornou os dados do produto.');
 const generic=/visite a p[aá]gina.*todos os produtos|perfil social|produtos.*em um s[oó] lugar/i.test(p.description||'');
 return {name,img,desc:generic?name:ImportTools.clean(p.description)||name,cat:ImportTools.category(name),store:ImportTools.store(url)||ImportTools.store(p.url),sourceUrl:p.url||url,currency:'BRL',productDetected:true,descriptionKind:generic?'title':'metadata'};
}
function importSnapshot(){return Object.fromEntries(['#fn','#fs','#fc','#fp','#fo','#fi','#fd'].map(sel=>[sel,$(sel).value]))}
async function auto(){
 const original=$('#fu').value.trim();let url;try{url=publicProductUrl(original)}catch(e){importStatus(e.message||'Cole um link HTTPS válido.','error');return}
 importRequest?.abort();const controller=new AbortController();importRequest=controller;
 let snapshot=importSnapshot();const button=$('#auto-fill');button.disabled=true;button.textContent='Consultando…';$('#import-preview').hidden=true;importStatus('Consultando a página pelo serviço de leitura online…','loading');
 const current=()=>importRequest===controller&&$('#fu')?.value.trim()===original;
 let timer=setTimeout(()=>controller.abort(),25000),product,error;
 try{
  try{product=await readThroughService(url,controller.signal)}catch(e){error=e}
  if(!current())return;
  if(!product||!product.img){
   importStatus('Tentando a leitura alternativa dos dados do link…','loading');
   try{const meta=await metadataThroughService(url,controller.signal);product=product?{...meta,...product,img:product.img||meta.img}:meta}catch(e){error=e}
  }
  if(!current())return;
  if(!product||!product.name||(!product.img&&!product.price))throw error||Error('A loja não disponibilizou os dados. Use a captura pela página aberta abaixo.');
  applyImportedProduct(product,'Leitura online · confira os valores na loja antes de publicar',snapshot);
  if(product.detailsUrl){
   snapshot=importSnapshot();clearTimeout(timer);timer=setTimeout(()=>controller.abort(),18000);importStatus('Nome, foto e valores encontrados. Procurando a descrição completa…','loading');
   try{const detail=await readThroughService(product.detailsUrl,controller.signal);if(current()&&detail?.productDetected&&detail.desc){const combined={...product,desc:detail.desc,descriptionKind:'full'};product=combined;applyImportedProduct(combined,'Leitura online · dados da página do produto',snapshot)}}catch{}
  }
  if(current()){
   const missing=[!product.price?'preço':'',!product.img?'foto':''].filter(Boolean);
   importStatus(missing.length?'Importação parcial. Confira '+missing.join(' e ')+' na loja e complete os campos.':'Dados preenchidos. Confira os valores e a variação antes de salvar. Seu link de afiliado foi mantido.',missing.length?'error':'ok');
   if(product.descriptionKind==='title')$('#import-source').textContent='Nome, foto e valores da oferta. Descrição baseada no título; revise ou complemente.';
  }
 }catch(e){if(current()){if(!$('#fs').value)$('#fs').value=ImportTools.store(original);importStatus(e.name==='AbortError'?'A consulta demorou mais que o esperado. Tente novamente ou use a captura pela página aberta.':(/Failed to fetch|NetworkError|Load failed/i.test(e.message||'')?'Não foi possível acessar o serviço de leitura. Confira a conexão ou use a captura abaixo.':e.message)||'Não foi possível consultar a loja. Use a captura abaixo.','error');$('#capture-help').open=true}}
 finally{clearTimeout(timer);if(importRequest===controller){importRequest=null;const b=$('#auto-fill');if(b){b.disabled=false;b.textContent='Preencher'}}}
}

function pasteProduct(){try{
 const text=$('#import-paste').value.trim();if(!text)throw Error('Cole os dados capturados primeiro.');if(text.length>3000000)throw Error('O conteúdo é muito grande. Use a captura pelo favorito.');
 let product;if(text.startsWith('CAFOFO_PRODUCT_V1:'))product=JSON.parse(text.slice('CAFOFO_PRODUCT_V1:'.length));
 else if(text.startsWith('{')){const data=JSON.parse(text);product=data.product||data}
 else if(/<(html|head|meta|script|!doctype)\b/i.test(text)){const doc=new DOMParser().parseFromString(text,'text/html');product=ImportTools.extract(doc,$('#fu').value.trim()||'https://www.mercadolivre.com.br')}
 else throw Error('Cole o conteúdo gerado pelo favorito Capturar achadinho ou o código HTML da página.');
 applyImportedProduct(product,'Captura da página aberta · confira preço e variação antes de salvar');
 }catch(e){importStatus('Não foi possível importar: '+e.message,'error')}}

const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,520/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.72))};i.src=URL.createObjectURL(f)});
async function add(){const url=$("#fu").value.trim(),name=$("#fn").value.trim();if(!url||!name)return toast("Informe link e nome");
 let img=$("#fi").value.trim();const f=$("#ff").files[0];if(f)img=await shrink(f);
 const o=editing&&S.products.find(p=>p.id===editing);
 const d={url,name,store:$("#fs").value.trim()||storeOf(url),cat:$("#fc").value,price:parseFloat($("#fp").value)||0,old:parseFloat($("#fo").value)||0,img:img||(o&&o.img)||"",desc:$("#fd").value.trim()||"Confira essa oferta!"};
 if(o){Object.assign(o,d)}else S.products.push({id:"p"+Date.now(),emoji:EM[d.cat],active:true,at:Date.now(),...d});
 editing=null;save();render();scrollTo(0,0);toast("Salvo! Clique em Baixar site atualizado");}
function tg(id){const p=S.products.find(x=>x.id===id);p.active=!p.active;save();render()}
function del(id){if(confirm("Excluir este produto?")){S.products=S.products.filter(p=>p.id!==id);save();render()}}
function cfg(){S.wa=$("#sw").value.trim()||S.wa;S.pin=$("#sp").value.trim()||S.pin;S.user=$("#su").value.trim()||S.user;save();toast("Configurações salvas")}

function downloadFile(filename,data,type){const blob=new Blob([data],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function bk(){downloadFile('backup-achadinho.json',JSON.stringify({S,ST},null,2),'application/json');toast('Backup baixado')}
function pub(){try{const c=document.documentElement.cloneNode(true);c.querySelector('#seed').textContent=JSON.stringify(S).replace(/</g,'\\u003c');c.querySelector('#app').innerHTML='';c.querySelector('#modal').innerHTML='';c.querySelectorAll('.toast').forEach(t=>t.remove());downloadFile('index.html','<!doctype html>\n'+c.outerHTML,'text/html;charset=utf-8');toast('HTML baixado! Envie o arquivo para sua hospedagem.')}catch(e){toast('Não foi possível baixar o HTML. Tente novamente.')}}

render();
