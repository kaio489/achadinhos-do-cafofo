<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Achadinho do Cafofo | Ofertas e achadinhos para o seu dia a dia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ee;--card:#fff;--ink:#16221b;--mut:#6a766e;--g:#0f3d2a;--g2:#1f6b45;--y:#c8932b;--line:#e4e0d4;--red:#b3392b;--on:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1712;--card:#12221a;--ink:#eef0ea;--mut:#9aa89f;--line:#24382c;--g:#e9e5d3;--g2:#4fa77a;--on:#0c1712}}
:root[data-theme="dark"]{--bg:#0c1712;--card:#12221a;--ink:#eef0ea;--mut:#9aa89f;--line:#24382c;--g:#e9e5d3;--g2:#4fa77a;--on:#0c1712}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{margin:0;font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.top{background:#0f3d2a;color:#f3efe0;position:sticky;top:0;z-index:5;border-bottom:1px solid #ffffff1a}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.logo{font-size:22px;color:#f3efe0}.logo b{color:#e0b350;font-weight:600;font-style:italic}
.btn{border:1px solid transparent;border-radius:10px;padding:11px 20px;font-weight:600;font-size:14px;background:#0f3d2a;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}
.btn:hover{background:#1f6b45}
.btn.wa{background:#1f9d57;color:#fff}.btn.wa:hover{background:#17844a}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--bg);border-color:var(--mut)}
.btn.sm{padding:7px 13px;font-size:13px}.btn.red{background:var(--red)}
.hero .btn:not(.wa){background:#f3efe0;color:#0f3d2a}.hero .btn:not(.wa):hover{background:#fff}
.sp{flex:1}
.hero{background-color:#0a2a1d;background-image:linear-gradient(90deg,rgba(10,42,29,.94) 0,rgba(10,42,29,.86) 45%,rgba(10,42,29,.55) 100%),var(--bn);background-size:cover;background-position:right center;color:#f3efe0;padding:56px 0 90px;position:relative}
.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#c8932b,transparent 60%)}
.hero-in{display:block}
.hero h1{font-size:clamp(30px,4.4vw,50px);line-height:1.08;max-width:720px}.hero h1 span{color:#e0b350;font-style:italic}
.hero p{max-width:540px;font-size:17px;color:#cfd8cf;margin:18px 0 0}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}
.pill{display:inline-block;color:#e0b350;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
.blob{display:none}
.tools{margin:-44px auto 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 8px 28px #0a2a1d1f;position:relative;display:grid;gap:14px}
input,select,textarea{width:100%;font:inherit;font-size:14px;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 3px #1f6b4526}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--line);background:transparent;color:var(--mut);border-radius:8px;padding:7px 15px;font-weight:600;font-size:13px;white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--mut)}
.chip.on{background:#0f3d2a;border-color:#0f3d2a;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:22px 0 48px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 32px #0a2a1d1f}
.img{aspect-ratio:1/1;font-size:48px;background:linear-gradient(135deg,#ece7d6,#f6f4ee);display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-size:72px;color:#c8bd9b;position:relative}
.img img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:8px;top:8px;background:#fff;color:#0f3d2a;font-family:"Plus Jakarta Sans",sans-serif;font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;box-shadow:0 1px 4px #0002}
.off{position:absolute;right:8px;top:8px;background:#b3392b;color:#fff;font-family:"Plus Jakarta Sans",sans-serif;font-weight:700;font-size:12px;padding:4px 9px;border-radius:6px}
.cb{padding:12px;display:flex;flex-direction:column;gap:5px;flex:1}
.cb small{color:var(--g2);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:10.5px}
.cb h3{font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cb p{margin:0;color:var(--mut);font-size:12px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-size:18px;font-weight:700;margin-top:4px}.price s{font-size:13px;color:var(--mut);font-weight:500;margin-left:8px}
.cb .btn{margin-top:6px;padding:8px 12px;font-size:13px}
.wa-box{background:#0f3d2a;color:#f3efe0;border-radius:16px;padding:48px 28px;text-align:center;margin:10px 0 64px}
.wa-box h2{font-size:32px}.wa-box p{color:#cfd8cf;margin:10px 0 22px}
footer{background:#0a2a1d;color:#a9b8ad;padding:36px 0;text-align:center;font-size:13px}
footer .btn{margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:60px 0;grid-column:1/-1}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.ah{background:#0f3d2a;color:#f3efe0;padding:14px 0;position:sticky;top:0;z-index:2}
.ah .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ah .btn:not(.ghost){background:#c8932b;color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:26px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.kpi b{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:32px;display:block;line-height:1.15}.kpi span{color:var(--mut);font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}
.panel h3{margin-bottom:14px;font-size:19px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.bar{display:grid;grid-template-columns:120px 1fr 34px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.bar i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--g2),var(--y))}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.f label,.panel>label{font-size:11px;font-weight:700;color:var(--mut);display:block;margin-bottom:4px;letter-spacing:.06em;text-transform:uppercase}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
td img{width:44px;height:44px;border-radius:8px;object-fit:cover}
.tag{padding:3px 10px;border-radius:6px;font-size:12px;font-weight:700}.on-t{background:#dcefe3;color:#14532d}.off-t{background:#f6dedb;color:#8a2417}
.note{font-size:13px;color:var(--mut);background:var(--bg);padding:12px 14px;border-radius:10px;margin-top:12px;border:1px solid var(--line)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#0f3d2a;color:#fff;padding:11px 22px;border-radius:10px;z-index:50;font-weight:600;font-size:14px}
.login{max-width:360px;margin:16vh auto}.login{text-align:center}
@media (max-width:720px){
.wrap{padding:0 14px}
.hero{padding:30px 0 62px;background-image:linear-gradient(rgba(10,42,29,.9),rgba(10,42,29,.82)),var(--bn);background-position:70% center}.hero h1{font-size:27px}.hero p{font-size:14px;margin-top:10px}.pill{margin-bottom:10px}.hero .cta{margin-top:16px;gap:8px}.hero .btn{padding:9px 14px;font-size:13px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cb{padding:10px}.cb h3{font-size:14px}.price{font-size:16px}.price s{display:block;margin:0;font-size:11px}
.badge,.off{font-size:10px;padding:3px 7px}
.top .btn{padding:7px 11px}.logo{font-size:19px}}
</style>
</head>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>n?Number(n).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):"";
const seed=JSON.parse($("#seed").textContent);
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S=ls.get("ach_state",null)||seed;
if(S.v!==2){S.user="kaiomorais";S.pin="1425";S.v=2}
let ST=ls.get("ach_stats",{visits:0,clicks:0,wa:0,prod:{},days:{}});
const save=()=>{ls.set("ach_state",S);ls.set("ach_stats",ST)};
const EM={"Casa e Móveis":"","Cozinha":"","Eletrônicos":"","Beleza":"","Moda":"","Ferramentas":"","Pet":"","Outros":""};
let q="",cat="Todos",admin=false,authed=false,editing=null;
try{if(!sessionStorage.getItem("v")){sessionStorage.setItem("v",1);ST.visits++;const d=new Date().toISOString().slice(0,10);ST.days[d]=(ST.days[d]||0)+1;save()}}catch(e){}
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const disc=p=>p.old&&p.price&&p.old>p.price?Math.round((1-p.price/p.old)*100):0;

function render(){admin?renderAdmin():renderSite()}
function renderSite(){
 const act=S.products.filter(p=>p.active);
 const list=act.filter(p=>(cat==="Todos"||p.cat===cat)&&(p.name+p.desc+p.store).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.at-a.at);
 const cats=["Todos",...S.cats.filter(c=>act.some(p=>p.cat===c))];
 $("#app").innerHTML=`
 <header class="top"><div class="wrap"><div class="logo">Achadinho <b>do Cafofo</b></div><div class="sp"></div>
 <a class="btn wa sm" href="${esc(S.wa)}" target="_blank" rel="noopener" onclick="cw()">Entrar no grupo</a></div></header>
 <section class="hero" style="--bn:url(${BANNER})"><div class="blob"></div><div class="wrap hero-in"><div class="hero-tx">
 <span class="pill">Ofertas atualizadas todos os dias</span>
 <h1>Achadinhos que <span>valem a pena</span> para o seu dia a dia</h1>
 <p>Selecionamos as melhores ofertas da Shopee, Mercado Livre, Amazon e AliExpress. É só escolher e clicar!</p>
 <div class="cta"><a class="btn wa" href="${esc(S.wa)}" target="_blank" rel="noopener" onclick="cw()">Entrar no grupo do WhatsApp</a><a class="btn" href="#cat">Ver catálogo</a></div></div></div></section>
 <main class="wrap" id="cat"><div class="tools"><input id="q" type="search" placeholder="Buscar produto, loja…" value="${esc(q)}">
 <div class="chips">${cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${esc(c)}">${c==="Todos"?"":EM[c]||""} ${esc(c)}</button>`).join("")}</div></div>
 <div class="grid">${list.map(p=>`<article class="card"><div class="img">${p.img?`<img loading="lazy" src="${esc(p.img)}" alt="${esc(p.name)}">`:esc((p.name||"?").charAt(0))}<span class="badge">${esc(p.store)}</span>${disc(p)?`<span class="off">-${disc(p)}%</span>`:""}</div>
 <div class="cb"><small>${esc(p.cat)}</small><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>
 <div class="price">${brl(p.price)}${p.old?`<s>${brl(p.old)}</s>`:""}</div>
 <a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener sponsored" onclick="ck('${p.id}')">Ver oferta →</a></div></article>`).join("")||`<div class="empty"> Nenhum achadinho encontrado por aqui ainda.</div>`}</div>
 <div class="wa-box"><h2>Não perca nenhuma oferta! </h2><p>Entre no nosso grupo e receba os achadinhos em primeira mão.</p><a class="btn wa" href="${esc(S.wa)}" target="_blank" rel="noopener" onclick="cw()">Quero entrar no grupo</a></div></main>
 <footer><div class="wrap"><div class="logo">Achadinho <b>do Cafofo</b></div><p style="margin:6px 0">Ofertas e achadinhos para o seu dia a dia · Como afiliados, podemos receber comissão pelas compras feitas pelos links, sem custo extra para você.</p>
 <button class="btn ghost sm" style="color:#cfe0cf;border-color:#2f7a3e" onclick="openAdmin()">Painel administrativo</button></div></footer>`;
 $("#q").oninput=e=>{q=e.target.value;const p=e.target.selectionStart;renderSite();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.c;renderSite()});
}
function ck(id){ST.clicks++;ST.prod[id]=(ST.prod[id]||0)+1;save()}
function cw(){ST.wa++;save()}
function openAdmin(){admin=true;authed=false;render();scrollTo(0,0)}
function closeAdmin(){admin=false;render()}

function storeOf(u){const h=u.toLowerCase();return /shopee|shp\.ee/.test(h)?"Shopee":/mercadoli|mercadolibre|meli\.la/.test(h)?"Mercado Livre":/amazon|amzn/.test(h)?"Amazon":/aliexpress|s\.click\.ali/.test(h)?"AliExpress":/magazine|magalu/.test(h)?"Magalu":"Outra loja"}
function guess(u){let n="";try{const seg=new URL(u).pathname.split("/").filter(x=>x.includes("-")).sort((a,b)=>b.length-a.length)[0]||"";n=decodeURIComponent(seg).replace(/-i\.\d+.*$/,"").replace(/[-_]+/g," ").replace(/\b(MLB|p)\s?\d+.*$/i,"").trim();n=n.charAt(0).toUpperCase()+n.slice(1)}catch(e){}
 const t=n.toLowerCase(),map=[["Cozinha",/panela|fritadeira|copo|garrafa|faca|air ?fryer|cozinha|talher/],["Eletrônicos",/fone|carregador|cabo|smart|celular|led|camera|bluetooth|mouse|teclado/],["Beleza",/creme|batom|perfume|maquiagem|cabelo|shampoo|skin/],["Moda",/camisa|tenis|bolsa|vestido|relogio|bermuda|calça/],["Ferramentas",/furadeira|chave|parafus|ferramenta|alicate/],["Pet",/pet|cachorro|gato|coleira/],["Casa e Móveis",/puff|sofa|estante|mesa|cadeira|poltrona|organizador|luminaria|tapete|cama/]];
 const c=(map.find(m=>m[1].test(t))||[])[0]||"Outros";return{name:n,cat:c}}

function stats(){const a=S.products,act=a.filter(p=>p.active);
 const by=(k)=>{const o={};a.forEach(p=>o[p[k]]=(o[p[k]]||0)+1);return Object.entries(o).sort((x,y)=>y[1]-x[1])};
 return{total:a.length,act:act.length,ina:a.length-act.length,by:by,cats:by("cat"),stores:by("store")}}
const bars=(arr)=>{const m=Math.max(1,...arr.map(x=>x[1]));return arr.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/m*100}%"></i><b>${v}</b></div>`).join("")||"<p class='note'>Sem dados ainda.</p>"};
function days7(){const out=[];for(let i=6;i>=0;i--){const d=new Date(Date.now()-i*864e5).toISOString().slice(0,10);out.push([d.slice(8)+"/"+d.slice(5,7),ST.days[d]||0])}return out}

function renderAdmin(){
 if(!authed){$("#app").innerHTML=`<div class="ov"><div class="login panel"><h2>Área restrita</h2><p style="color:var(--mut)">Entre com seu login e senha</p><input id="usr" placeholder="Login" autocomplete="username" autofocus><br><br><input id="pin" type="password" placeholder="Senha" autocomplete="current-password"><br><br><button class="btn" id="go">Entrar</button> <button class="btn ghost" onclick="closeAdmin()">Voltar</button></div></div>`;
  const go=()=>{if($("#usr").value.trim().toLowerCase()===S.user.toLowerCase()&&$("#pin").value===S.pin){authed=true;render()}else toast("Login ou senha incorretos")};$("#go").onclick=go;$("#pin").onkeydown=e=>e.key==="Enter"&&go();return}
 const s=stats(),top=[...S.products].sort((a,b)=>(ST.prod[b.id]||0)-(ST.prod[a.id]||0)).slice(0,5).filter(p=>ST.prod[p.id]);
 const e=editing?S.products.find(p=>p.id===editing):null;
 $("#app").innerHTML=`<div class="ov"><div class="ah"><div class="wrap"><div class="logo">Painel · Achadinho <b>do Cafofo</b></div><div class="sp"></div><button class="btn sm" onclick="pub()">Publicar no site</button><button class="btn ghost sm" style="color:#fdf6e3" onclick="closeAdmin()">Ver site</button></div></div>
 <div class="wrap"><div class="kpis">
 <div class="kpi"><b>${s.total}</b><span>Produtos</span></div><div class="kpi"><b style="color:var(--g2)">${s.act}</b><span>Ativos</span></div><div class="kpi"><b style="color:var(--red)">${s.ina}</b><span>⏸ Inativos</span></div>
 <div class="kpi"><b>${ST.visits}</b><span>Visitas</span></div><div class="kpi"><b>${ST.clicks}</b><span>Cliques em ofertas</span></div><div class="kpi"><b>${ST.wa}</b><span>Cliques no WhatsApp</span></div>
 <div class="kpi"><b>${ST.visits?Math.round(ST.clicks/ST.visits*100):0}%</b><span>Cliques por visita</span></div></div>
 <div class="panel"><h3>${e?"Editar produto":"Novo produto"}</h3>
 <label style="font-size:12px;font-weight:800;color:var(--mut)">Cole o link do produto</label>
 <div style="display:flex;gap:8px;margin-bottom:10px"><input id="fu" placeholder="https://shopee.com.br/..." value="${esc(e?.url||"")}"><button class="btn" onclick="auto()">Preencher</button></div>
 <div class="f"><div><label>Nome</label><input id="fn" value="${esc(e?.name||"")}"></div>
 <div><label>Loja</label><input id="fs" value="${esc(e?.store||"")}"></div>
 <div><label>Categoria</label><select id="fc">${S.cats.map(c=>`<option ${e?.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></div>
 <div><label>Preço (R$)</label><input id="fp" type="number" step="0.01" value="${e?.price||""}"></div>
 <div><label>Preço antes (R$)</label><input id="fo" type="number" step="0.01" value="${e?.old||""}"></div>
 <div><label>Link da foto (opcional)</label><input id="fi" value="${esc(e?.img&&!e.img.startsWith("data:")?e.img:"")}"></div>
 <div><label>ou enviar foto</label><input id="ff" type="file" accept="image/*"></div></div>
 <div style="margin:10px 0"><label style="font-size:12px;font-weight:800;color:var(--mut)">Descrição</label><textarea id="fd" rows="2">${esc(e?.desc||"")}</textarea></div>
 <button class="btn" onclick="add()">${e?"Salvar alterações":"Adicionar ao catálogo"}</button> ${e?`<button class="btn ghost" onclick="editing=null;render()">Cancelar</button>`:""}
 <p class="note">O botão  detecta a loja, sugere nome e categoria a partir do link. Lojas bloqueiam a leitura automática de foto e preço por navegador: cole o link da imagem (botão direito na foto → copiar endereço) ou envie o arquivo. Depois de editar, clique em <b>Publicar no site</b> para o catálogo ficar visível a todos.</p></div>
 <div class="two"><div class="panel"><h3>Produtos por categoria</h3>${bars(s.cats)}</div><div class="panel"><h3>Produtos por loja</h3>${bars(s.stores)}</div>
 <div class="panel"><h3>Visitas (7 dias)</h3>${bars(days7())}</div><div class="panel"><h3>Mais clicados</h3>${bars(top.map(p=>[p.name.slice(0,16),ST.prod[p.id]]))}</div></div>
 <div class="panel"><h3>Todos os produtos</h3><div class="tw"><table><tr><th></th><th>Produto</th><th>Loja</th><th>Cliques</th><th>Status</th><th>Ações</th></tr>
 ${[...S.products].sort((a,b)=>b.at-a.at).map(p=>`<tr><td>${p.img?`<img src="${esc(p.img)}" alt="">`:""}</td><td><b>${esc(p.name)}</b><br><small>${esc(p.cat)} · ${brl(p.price)}</small></td><td>${esc(p.store)}</td><td>${ST.prod[p.id]||0}</td>
 <td><span class="tag ${p.active?"on-t":"off-t"}">${p.active?"Ativo":"Inativo"}</span></td><td style="white-space:nowrap"><button class="btn ghost sm" onclick="tg('${p.id}')">${p.active?"Desativar":"Ativar"}</button> <button class="btn ghost sm" onclick="editing='${p.id}';render();scrollTo(0,0)">Editar</button> <button class="btn red sm" onclick="del('${p.id}')">Excluir</button></td></tr>`).join("")||`<tr><td colspan=6>Nenhum produto.</td></tr>`}</table></div></div>
 <div class="panel"><h3>Configurações</h3><div class="f"><div><label>Link do grupo do WhatsApp</label><input id="sw" value="${esc(S.wa)}"></div><div><label>Login do painel</label><input id="su" value="${esc(S.user)}"></div><div><label>Senha do painel</label><input id="sp" value="${esc(S.pin)}"></div></div><br>
 <button class="btn" onclick="cfg()">Salvar</button> <button class="btn ghost" onclick="bk()">⬇ Backup (JSON)</button>
 <p class="note">Visitas e cliques são contados neste navegador. Para contar o público inteiro (todos os visitantes), é preciso ligar o site a um banco de dados, como Supabase + Vercel. Dá para fazer como próximo passo. O login e a senha ficam no código da página, então servem como trava simples, não como segurança forte.</p></div>
 </div></div>`}

function auto(){const u=$("#fu").value.trim();if(!u)return toast("Cole um link primeiro");const g=guess(u);$("#fs").value=storeOf(u);if(!$("#fn").value)$("#fn").value=g.name;$("#fc").value=g.cat;toast("Preenchido! Confira os dados")}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,520/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);r(c.toDataURL("image/jpeg",.72))};i.src=URL.createObjectURL(f)});
async function add(){const url=$("#fu").value.trim(),name=$("#fn").value.trim();if(!url||!name)return toast("Informe link e nome");
 let img=$("#fi").value.trim();const f=$("#ff").files[0];if(f)img=await shrink(f);
 const o=editing&&S.products.find(p=>p.id===editing);
 const d={url,name,store:$("#fs").value.trim()||storeOf(url),cat:$("#fc").value,price:parseFloat($("#fp").value)||0,old:parseFloat($("#fo").value)||0,img:img||(o&&o.img)||"",desc:$("#fd").value.trim()||"Confira essa oferta!"};
 if(o){Object.assign(o,d)}else S.products.push({id:"p"+Date.now(),emoji:EM[d.cat],active:true,at:Date.now(),...d});
 editing=null;save();render();scrollTo(0,0);toast("Salvo! Clique em Publicar no site");}
function tg(id){const p=S.products.find(x=>x.id===id);p.active=!p.active;save();render()}
function del(id){if(confirm("Excluir este produto?")){S.products=S.products.filter(p=>p.id!==id);save();render()}}
function cfg(){S.wa=$("#sw").value.trim()||S.wa;S.pin=$("#sp").value.trim()||S.pin;S.user=$("#su").value.trim()||S.user;save();toast("Configurações salvas")}
async function bk(){const data=JSON.stringify({S,ST},null,1);try{const d=await claude.use("downloads");await d.save({filename:"backup-achadinho.json",data})}catch(e){toast("Download indisponível aqui")}}
async function pub(){try{const a=await claude.use("artifact");if(!a)return toast("Publicação indisponível neste modo");
 const c=document.documentElement.cloneNode(true);c.querySelector("#seed").textContent=JSON.stringify(S).replace(/</g,"\\u003c");c.querySelector("#app").innerHTML="";c.querySelector("#modal").innerHTML="";
 toast("Publicando…");await a.publish("<!doctype html>\n"+c.outerHTML)}catch(e){toast("Não foi possível publicar: "+(e&&e.code||"erro"))}}
render();
</script>
</body>
